syntax = "proto3";

package dispatch.shard;

service Shard {
  rpc SearchBoundaryDrivers(SearchBoundaryDriversRequest) returns (SearchBoundaryDriversResponse);
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc Confirm(ReservationRef) returns (ReservationState);
  rpc Abort(ReservationRef) returns (ReservationState);
  rpc GetReservationStatus(ReservationRef) returns (ReservationState);
}

message SearchBoundaryDriversRequest {
  repeated uint64 cells = 1;
  uint32 limit = 2;
}

message BoundaryDriver {
  string driver_id = 1;
  uint64 cell = 2;
  int64 reported_at_ms = 3;
}

message SearchBoundaryDriversResponse {
  repeated BoundaryDriver drivers = 1;
}

message ReserveRequest {
  string reservation_id = 1;
  string driver_id = 2;
  string ride_request_id = 3;
}

message ReserveResponse {
  bool reserved = 1;
  int64 expires_at_ms = 2;
}

message ReservationRef {
  string reservation_id = 1;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_RESERVED = 1;
  RESERVATION_STATUS_CONFIRMED = 2;
  RESERVATION_STATUS_ABORTED = 3;
  RESERVATION_STATUS_EXPIRED = 4;
}

message ReservationState {
  ReservationStatus status = 1;
}
