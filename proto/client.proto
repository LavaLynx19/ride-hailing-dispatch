syntax = "proto3";

package dispatch.client;

message LatLng {
  double lat = 1;
  double lng = 2;
}

message LocationPing {
  string driver_id = 1;
  LatLng position = 2;
  int64 reported_at_ms = 3;
}

message Offer {
  string offer_id = 1;
  string ride_request_id = 2;
  LatLng pickup = 3;
  int64 expires_at_ms = 4;
}

message OfferGone {
  string offer_id = 1;
}

message Accept {
  string offer_id = 1;
}

message Decline {
  string offer_id = 1;
}

message TripAssigned {
  string trip_id = 1;
  string ride_request_id = 2;
}

enum TripEventKind {
  TRIP_EVENT_KIND_UNSPECIFIED = 0;
  TRIP_EVENT_KIND_ARRIVED = 1;
  TRIP_EVENT_KIND_STARTED = 2;
  TRIP_EVENT_KIND_COMPLETED = 3;
}

message TripEvent {
  string trip_id = 1;
  TripEventKind kind = 2;
  LatLng position = 3;
  int64 occurred_at_ms = 4;
  // Recorded while the driver was out of contact and sent on reconnect.
  bool buffered = 5;
}

message DriverToServer {
  oneof message {
    LocationPing location_ping = 1;
    Accept accept = 2;
    Decline decline = 3;
    TripEvent trip_event = 4;
  }
}

message ServerToDriver {
  oneof message {
    Offer offer = 1;
    OfferGone offer_gone = 2;
    TripAssigned trip_assigned = 3;
  }
}

message QuoteRequest {
  string rider_id = 1;
  LatLng pickup = 2;
}

message Quote {
  string quote_id = 1;
  double surge_multiplier = 2;
  int64 expires_at_ms = 3;
}

message RideRequest {
  string ride_request_id = 1;
  string quote_id = 2;
  LatLng pickup = 3;
}

message OfferProgress {
  string ride_request_id = 1;
  string status = 2;
}

message TripStatus {
  string trip_id = 1;
  string ride_request_id = 2;
  string status = 3;
}

message RiderToServer {
  oneof message {
    QuoteRequest quote_request = 1;
    RideRequest ride_request = 2;
  }
}

message ServerToRider {
  oneof message {
    Quote quote = 1;
    OfferProgress offer_progress = 2;
    TripStatus trip_status = 3;
  }
}
