# Phase 1 baseline: one Shard and the load generator, with no Postgres yet.
name: ride-hailing-baseline

x-limits: &limits
  ulimits:
    nofile: 200000

services:
  shard:
    <<: *limits
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: shard
    image: ride-hailing-dispatch/shard
    # Several ports, because one client address can reach one server port only about 28,000 times.
    command:
      - "0.0.0.0:7001,0.0.0.0:7003,0.0.0.0:7005,0.0.0.0:7007"
      - "0.0.0.0:7002,0.0.0.0:7004,0.0.0.0:7006,0.0.0.0:7008"
      - /ping-log
    # A new named volume belongs to root, and the image has no directory prepared for the app user.
    user: root
    volumes:
      - ping-log:/ping-log

  simulator:
    <<: *limits
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: simulator
    image: ride-hailing-dispatch/simulator
    cpus: 2
    depends_on:
      - shard
    volumes:
      - ../data/raw:/data:ro

volumes:
  ping-log:
