# Experiment setup: one Shard with its Postgres, and the load generator.
name: ride-hailing-baseline

x-limits: &limits
  ulimits:
    nofile: 200000

services:
  # Throwaway experiment data, wiped with `down -v` before and after each run. Trust auth is
  # safe only because no port is published: Postgres is reachable on the internal network alone.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatch"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql

  shard:
    <<: *limits
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: shard
    image: ride-hailing-dispatch/shard
    # Several ports, because one client address can reach one server port only about 28,000 times.
    command:
      - "0.0.0.0:7001,0.0.0.0:7003,0.0.0.0:7005,0.0.0.0:7007"
      - "0.0.0.0:7002,0.0.0.0:7004,0.0.0.0:7006,0.0.0.0:7008"
      - /ping-log
    # A new named volume belongs to root, and the image has no directory prepared for the app user.
    user: root
    environment:
      DATABASE_URL: postgres://postgres@postgres/dispatch
      MATCHER: ${MATCHER:-greedy}
      BATCH_WINDOW_MS: ${BATCH_WINDOW_MS:-}
      WIDENING: ${WIDENING:-off}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ping-log:/ping-log

  simulator:
    <<: *limits
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: simulator
    image: ride-hailing-dispatch/simulator
    cpus: 2
    depends_on:
      - shard
    volumes:
      - ../data/raw:/data:ro

volumes:
  ping-log:
  postgres:
